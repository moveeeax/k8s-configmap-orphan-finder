# A small, realistic namespace: two live workloads, one Deployment that was
# deleted last year, and one reference that no longer resolves.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      serviceAccountName: payments
      containers:
        - name: payments
          image: ghcr.io/acme/payments:2.3.1
          envFrom:
            - configMapRef:
                name: payments-env
          env:
            - name: STRIPE_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe
                  key: secret_key
          volumeMounts:
            - name: trust
              mountPath: /etc/ssl/acme
      volumes:
        - name: trust
          configMap:
            name: acme-ca-bundle
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: settlement
  namespace: payments
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: settle
              image: ghcr.io/acme/settlement:1.1.0
              envFrom:
                - secretRef:
                    name: sftp-credentials
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments
  namespace: payments
imagePullSecrets:
  - name: ghcr
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments
  namespace: payments
spec:
  tls:
    - hosts: ["pay.acme.test"]
      secretName: pay-acme-test-tls
  rules:
    - host: pay.acme.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payments
                port:
                  number: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-env
  namespace: payments
data:
  LOG_LEVEL: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-root-ca.crt
  namespace: payments
data:
  ca.crt: "-----BEGIN CERTIFICATE-----"
---
# The legacy-checkout Deployment was removed in the 2025 rewrite; its config
# was not.
apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-checkout-nginx
  namespace: payments
data:
  nginx.conf: "upstream checkout { server 127.0.0.1:9000; }"
---
apiVersion: v1
kind: Secret
metadata:
  name: stripe
  namespace: payments
type: Opaque
stringData:
  secret_key: sk_test_example
---
apiVersion: v1
kind: Secret
metadata:
  name: sftp-credentials
  namespace: payments
type: Opaque
stringData:
  password: example
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr
  namespace: payments
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: "{}"
---
apiVersion: v1
kind: Secret
metadata:
  name: pay-acme-test-tls
  namespace: payments
type: kubernetes.io/tls
stringData:
  tls.crt: "x"
  tls.key: "y"
---
# Rotated in March, replaced by `stripe`, never deleted.
apiVersion: v1
kind: Secret
metadata:
  name: stripe-old
  namespace: payments
type: Opaque
stringData:
  secret_key: sk_test_rotated
