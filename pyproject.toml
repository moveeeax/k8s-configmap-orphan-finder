[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-configmap-orphan-finder"
version = "0.1.0"
description = "Find ConfigMaps and Secrets that no workload references anymore"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["kubernetes", "configmap", "secrets", "cleanup", "audit", "sre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
live = ["kubernetes>=24.2"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/moveeeax/k8s-configmap-orphan-finder"
Issues = "https://github.com/moveeeax/k8s-configmap-orphan-finder/issues"

[project.scripts]
k8s-configmap-orphan-finder = "k8s_configmap_orphan_finder.cli:main"

[tool.setuptools]
packages = ["k8s_configmap_orphan_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
