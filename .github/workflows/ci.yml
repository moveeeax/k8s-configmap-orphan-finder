name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Test
        run: pytest -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Clean tree exits 0
        run: k8s-configmap-orphan-finder --manifests tests/fixtures/clean

      - name: Examples tree reports findings and exits 1
        run: |
          set +e
          k8s-configmap-orphan-finder --manifests examples/k8s --json > findings.json
          code=$?
          set -e
          cat findings.json
          test "$code" = "1"
          python - <<'PY'
          import json
          data = json.load(open("findings.json"))
          names = {f["name"] for f in data["findings"]}
          assert "stripe-old" in names, names
          assert "legacy-checkout-nginx" in names, names
          assert "acme-ca-bundle" in names, names
          assert "kube-root-ca.crt" not in names, names
          print("smoke ok:", len(data["findings"]), "findings")
          PY
